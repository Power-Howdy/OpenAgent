version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # Only enable security updates, disable regular dependency bumps
    open-pull-requests-limit: 10
    reviewers:
      - "severus"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Only allow security updates
    allow:
      - dependency-type: "direct"
        update-type: "security"